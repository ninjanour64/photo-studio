<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111114" />
    <title>Glow Photo Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb36b'/%3E%3Cstop offset='1' stop-color='%23ff4f8b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="logo"></span><span class="brand-name">Glow</span></div>
        <div class="top-actions">
          <button id="btn-open" class="btn ghost" type="button" title="Open a photo">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h5l2 2h9v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 12v5M9.5 14.5 12 12l2.5 2.5"/></svg>
            <span class="hide-sm">Open</span>
          </button>
          <button id="btn-undo" class="icon-btn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
          </button>
          <button id="btn-redo" class="icon-btn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
          </button>
          <button id="btn-compare" class="btn ghost" type="button" title="Hold to see the original (\)">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
            <span class="hide-sm">Hold to compare</span>
          </button>
          <button id="btn-export" class="btn primary" type="button" title="Save (Ctrl+S)">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg>
            Save
          </button>
        </div>
      </header>

      <main class="workspace">
        <div class="stage" id="stage">
          <canvas id="gl"></canvas>
          <canvas id="overlay"></canvas>
          <div class="drop" id="drop">
            <div class="drop-inner">
              <div class="drop-art"></div>
              <h1>Make your photo glow</h1>
              <p>Fix light, colour and skin in one tap — then fine-tune faces, looks and backgrounds with simple sliders.</p>
              <button id="drop-open" class="btn primary big" type="button">Choose a photo</button>
              <p class="drop-sub">or drop it here, or paste it · everything stays on your device</p>
            </div>
          </div>
          <div class="original-tag">Original</div>
          <div class="zoom" aria-label="Zoom">
            <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <button id="zoom-fit" class="icon-btn" type="button" aria-label="Fit to screen"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
          <div class="busy" id="busy"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
        <aside class="panel">
          <nav class="tabs" id="tabs" aria-label="Tools"></nav>
          <div class="panel-body" id="panel-body"></div>
        </aside>
      </main>
      <input id="file" type="file" accept="image/*,.heic,.heif" hidden />
      <dialog id="export-dialog"></dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
